<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <link rel="icon" type="image/x-icon" href="/static/ship/static/img/dogui_ai_logo.png">
    <title>DOGUI.ai</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="/static/ship/static/css/homepage.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/"
            }
        }
    </script>
</head>
<body>


    <canvas id="bg"></canvas>
    <div id="cockpit-ui" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
        <!-- Radar Display -->
        <div style="position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.5); color: #0f0; padding: 10px; font-family: monospace;">
            RADAR: SCANNING...
        </div>

        <!-- Heading Display -->
        <div style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 5px 15px; border-radius: 10px;">
            HEADING: 0.00°
        </div>

        <!-- Control Panel -->
        <div style="position: absolute; bottom: 100px; right: 30px; width: 200px; background: rgba(0,0,0,0.6); border: 1px solid #444; padding: 10px;">
            <div style="color: #0ff; margin-bottom: 8px;">SYSTEMS OFFLINE</div>
            <div style="height: 2px; background: #0f0; margin: 5px 0;"></div>
            <div style="color: white;">SPEED: 247 m/s</div>
            <div style="color: white;">SHIELDS: 100%</div>
        </div>
    </div>

    <script type="module" src="/static/ship/static/js/Ship6.js"></script>
</body>
</html>
