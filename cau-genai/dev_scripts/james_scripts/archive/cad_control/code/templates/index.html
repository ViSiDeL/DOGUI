<!DOCTYPE html>
<html lang="en">
<head>
    <title>CAD Assistant</title>
    <script>
        function sendMessage() {
            let userMessage = document.getElementById('userInput').value;
            fetch('/chat', {
                method: 'POST',
                body: JSON.stringify({ message: userMessage }),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('chatbox').innerHTML += "<p><b>User:</b> " + userMessage + "</p>";
                document.getElementById('chatbox').innerHTML += "<p><b>AI:</b> " + data.ai_reply + "</p>";
                document.getElementById('chatbox').innerHTML += "<p><b>CAD:</b> " + data.cad_reply + "</p>";
                document.getElementById('userInput').value = "";
            });
        }
    </script>
</head>
<body>
    <h1>CAD Assistant</h1>
    <div id="chatbox"></div>
    <input type="text" id="userInput">
    <button onclick="sendMessage()">Send</button>
</body>
</html>
