<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOGUI.ai</title>
    <link rel="stylesheet" href="static/dogui_style.css">
    <link rel="stylesheet" href="static/three.css">

    <script type="importmap">
        {
            "imports": {
                "three": "/node_modules/three/build/three.module.js",
                "three-orbitcontrols": "/node_modules/three/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
</head>
<body>
    <div class="content">
        <div class="page-content">
            <div id="container">
                <div id="sidebar">
                    <h2>AI 3D Model Generator</h2>
                    <p>Describe your engineering project or model:</p>
                    <textarea id="description" placeholder="e.g., 'A red gear with 20 teeth and a blue piston connected to it'"></textarea>
                    <button id="generate-btn">Generate 3D Model</button>
                    <div id="status"></div>
                </div>
                <div id="canvas-container">
                    <canvas id="threejs-canvas"></canvas>
                </div>
            </div>          
        </div>
    </div>

    <script type="module" src="static/generation.js"></script>
</body>
</html>
