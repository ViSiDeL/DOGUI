<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.name }} DOGUI.ai</title>
    <link rel="stylesheet" href="/static/css/dogui_style.css">
    <link rel="stylesheet" href="/static/css/engineering.css">

    <script type="importmap">
        {
            "imports": {
                "three": "/node_modules/three/build/three.module.js",
            }
        }
    </script>
</head>
<body>
    <div class="content">
        {% include 'includes/user-nav.html' %}
        <div class="project-header">
            <h1>{{ project.name }}</h1>
        </div>

        <div class="page-content">
            <!-- Phase Tabs -->
            <div class="phase-tabs">
                <button class="tab-button {% if project.phase == 'ideation' %}active{% endif %}" 
                        data-phase="ideation">Ideation</button>
                <button class="tab-button {% if project.phase == 'simulation' %}active{% endif %}" 
                        data-phase="simulation">Simulation</button>
                <button class="tab-button {% if project.phase == 'implementation' %}active{% endif %}" 
                        data-phase="implementation">Implementation</button>
            </div>
            
            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Ideation Tab -->
                <div id="ideation-content" class="tab-pane {% if project.phase == 'ideation' %}active{% endif %}">
                    <p id="ideation-prompt">Please describe your new project:</p>
                    <form id="ideation-form" method="POST" action="/update-project/{{ user.username }}/{{ project.id }}">
                        <textarea name="description" placeholder="Describe your project in detail...">{{ project.description }}</textarea>
                        <button type="submit">Save Description</button>
                    </form>
                </div>
                
                <!-- Simulation Tab -->
                <div id="simulation-content" class="tab-pane {% if project.phase == 'simulation' %}active{% endif %}">
                    <div class="under-construction">
                        <p>Simulation phase coming soon!</p>
                    </div>
                </div>
                
                <!-- Implementation Tab -->
                <div id="implementation-content" class="tab-pane {% if project.phase == 'implementation' %}active{% endif %}">
                    <div class="under-construction">
                        <p>Implementation phase coming soon!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Tab switching functionality
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                const phase = this.dataset.phase;
                
                // Update active tab
                document.querySelectorAll('.tab-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                this.classList.add('active');
                
                // Update active content
                document.querySelectorAll('.tab-pane').forEach(pane => {
                    pane.classList.remove('active');
                });
                document.getElementById(`${phase}-content`).classList.add('active');
                
                // TODO: Add AJAX call to update project phase in database
            });
        });
    </script>
</body>
</html>
