<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Model - DOGUI.ai</title>
    <link rel="stylesheet" href="/static/css/dogui_style.css">
    <link rel="stylesheet" href="/static/css/engineering.css">
    <link rel="stylesheet" href="/static/css/three.css">
    <script type="importmap">
        {
            "imports": {
                "three": "/node_modules/three/build/three.module.js",
                "three-orbitcontrols": "/node_modules/three/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
</head>
<body>
    <div class="content">
        {% include 'includes/user-nav.html' %}
        <div class="page-content">
            <div id="container">
                <div id="sidebar">
                    <h2 style="font-size: 1.2rem;">AI 3D Model Generator</h2>
                    <p style="font-size: 1rem;">Describe your engineering project or model:</p>
                    <textarea id="description" placeholder="e.g., 'A red ball'"></textarea>
                    <button id="generate-btn">Generate 3D Model</button>
                    <div id="status"></div>
                </div>
                <div id="canvas-container">
                    <canvas id="threejs-canvas"></canvas>
                </div>
                <button id="save-model">Save As Asset</button>
            </div>          
        </div>
    </div>
    <script type="module" src="/static/js/generation.js"></script>
</body>
</html>
