
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Assist - DOGUI.ai</title>
    <link rel="stylesheet" href="/static/css/dogui_style.css">
    <link rel="stylesheet" href="/static/css/engineering.css">
    <link rel="stylesheet" href="/static/css/assets.css">

    <script type="importmap">
        {
            "imports": {
                "three": "/node_modules/three/build/three.module.js",
            }
        }
    </script>
</head>
<body>
    <div class="content">
        {% include 'includes/user-nav.html' %}
        <div class="page-content">
            <h1>CAD Assist</h1>
            
            <div class="creation-flow">
                <div class="step active">
                    <h3>Choose CAD Software</h3>
                    <div class="options-grid">
                        <form method="" action="">
                            <input type="hidden" name="asset_type" value="drawing">
                            <input type="hidden" name="creation_method" value="upload">
                            <button type="submit" class="option-card">
                                <div class="option-icon">
                                    <img src="/static/img/navicons/blueprint.png" alt="AutoCAD">
                                </div>
                                <div class="option-label">AutoCAD</div>
                            </button>
                        </form>
                        
                        <form method="" action="">
                            <input type="hidden" name="asset_type" value="drawing">
                            <input type="hidden" name="creation_method" value="CAD">
                            <button type="submit" class="option-card">
                                <div class="option-icon">
                                    <img src="/static/img/navicons/sculpture.png" alt="Blender">
                                </div>
                                <div class="option-label">Blender</div>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
