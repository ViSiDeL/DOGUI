{% extends "dogui.html" %}

{% block title %}New CAD Drawing | {% endblock %}

{% block css %}
    <link rel="stylesheet" href="/static/css/engineering.css">
    <link rel="stylesheet" href="/static/css/assets.css">
{% endblock %}

{% block nav %}{% include 'includes/user-nav.html' %}{% endblock %}

{% block content %}
<div class="page-content">
    <h1>Create CAD Drawing</h1>
    
    <div class="creation-flow">
        
        <div class="step active">
            <h3>Choose Creation Method</h3>
            <div class="options-grid">
                <form method="POST" action="{{ url_for('asset.new_asset') }}">
                    <input type="hidden" name="asset_type" value="drawing">
                    <input type="hidden" name="creation_method" value="upload">
                    <button type="submit" class="option-card">
                        <div class="option-icon">
                            <img src="/static/img/navicons/upload.png" alt="Upload Drawing">
                        </div>
                        <div class="option-label">Upload Drawing</div>
                    </button>
                </form>
                
                <form method="POST" action="{{ url_for('asset.new_asset') }}">
                    <input type="hidden" name="asset_type" value="drawing">
                    <input type="hidden" name="creation_method" value="CAD">
                    <button type="submit" class="option-card">
                        <div class="option-icon">
                            <img src="/static/img/navicons/cad.png" alt="CAD Assist">
                        </div>
                        <div class="option-label">watson CAD Assist</div>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}

{% endblock %}
